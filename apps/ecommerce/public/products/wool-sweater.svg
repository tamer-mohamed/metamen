<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#F1EBDD"/>

  <!-- body -->
  <path d="M 258 260
           Q 258 226 292 226
           L 340 226
           Q 400 272 460 226
           L 508 226
           Q 542 226 542 260
           L 542 590
           Q 542 616 516 616
           L 284 616
           Q 258 616 258 590
           Z"
        fill="#D8CCB8" stroke="#2E2A24" stroke-width="3" stroke-linejoin="round"/>

  <!-- collar ribbing -->
  <path d="M 340 226 Q 400 272 460 226 L 460 246 Q 400 290 340 246 Z" fill="#45543F"/>

  <!-- hem ribbing -->
  <rect x="258" y="566" width="284" height="50" rx="14" fill="#45543F"/>

  <!-- knit texture -->
  <g stroke="#2E2A24" stroke-width="2" opacity="0.14">
    <line x1="278" y1="330" x2="522" y2="330"/>
    <line x1="278" y1="380" x2="522" y2="380"/>
    <line x1="278" y1="430" x2="522" y2="430"/>
    <line x1="278" y1="480" x2="522" y2="480"/>
    <line x1="278" y1="530" x2="522" y2="530"/>
  </g>

  <!-- sleeves, laid flat and angled outward from the shoulders, drawn on top -->
  <g stroke="#2E2A24" stroke-width="3" stroke-linejoin="round">
    <rect x="-98" y="0" width="98" height="230" rx="32" transform="translate(262,258) rotate(-22)" fill="#D8CCB8"/>
    <rect x="0" y="0" width="98" height="230" rx="32" transform="translate(538,258) rotate(22)" fill="#D8CCB8"/>
  </g>
  <g>
    <rect x="-98" y="150" width="98" height="54" rx="18" transform="translate(262,258) rotate(-22)" fill="#45543F"/>
    <rect x="0" y="150" width="98" height="54" rx="18" transform="translate(538,258) rotate(22)" fill="#45543F"/>
  </g>
</svg>
